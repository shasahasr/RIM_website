<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- SEO Meta Tags -->
		<meta name="description" content="Xylo - Simplify your inventory management with our innovative XyloBalance Scales and smart notification system. Retro-fit solutions for businesses across the nation." />
		<meta name="keywords" content="inventory management, smart scales, business automation, notification system, retro-fit solutions, XyloBalance" />
		<meta name="author" content="Xylo" />
		<meta name="robots" content="index, follow" />

		<!-- Open Graph Meta Tags -->
		<meta property="og:title" content="Xylo - Simplify Your Inventory Management" />
		<meta property="og:description" content="Innovative inventory management solutions with XyloBalance Scales and smart notifications. Retro-fit to your existing systems." />
		<meta property="og:image" content="https://xylo-website.vercel.app/assets/img/xylo-logo.png" />
		<meta property="og:url" content="https://xylo-website.vercel.app" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Xylo" />

		<!-- Twitter Card Meta Tags -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Xylo - Simplify Your Inventory Management" />
		<meta name="twitter:description" content="Innovative inventory management solutions with XyloBalance Scales and smart notifications." />
		<meta name="twitter:image" content="https://xylo-website.vercel.app/assets/img/xylo-logo.png" />

		<!-- Canonical URL -->
		<link rel="canonical" href="https://xylo-website.vercel.app" />

		<link rel="icon" type="image/png" href="favicon.ico" />

		<!-- JSON-LD Structured Data -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "Organization",
			"name": "Xylo",
			"url": "https://xylo-website.vercel.app",
			"logo": "https://xylo-website.vercel.app/assets/img/xylo-logo.png",
			"description": "Innovative inventory management solutions with XyloBalance Scales and smart notifications. Retro-fit to your existing systems.",
			"sameAs": [
				"https://www.facebook.com/profile.php?id=61558002881860",
				"https://www.instagram.com/buyxylo/"
			],
			"contactPoint": {
				"@type": "ContactPoint",
				"contactType": "customer service",
				"availableLanguage": "English"
			}
		}
		</script>

		<title>Xylo - Simplify Your Inventory Management | Smart Scales & Notifications</title>

		<!-- Early theme application to avoid flash of wrong theme -->
		<script>
			(function() {
				try {
					var t = localStorage.getItem('selected-theme');
					var html = document.documentElement;
					if (t === 'light') {
						html.classList.remove('dark');
					} else {
						html.classList.add('dark');
					}
				} catch(e) {}
			})();
		</script>
		<!-- Critical inline CSS for background so initial paint matches theme -->
		<style>
			html.dark, html.dark body { background-color: #121212; color: #d2d2d7; }
			html:not(.dark), html:not(.dark) body { background-color: #fbfbfd; color: #6e6e73; }
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
